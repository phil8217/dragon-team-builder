[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dragon-team-builder"
version = "0.1.0"
description = "龍魂旅人角色資料與隊伍組成工具"
requires-python = ">=3.11"
dependencies = [
    "opencc-python-reimplemented>=0.1.7",
    "PySide6>=6.8,<7",
]

[project.scripts]
dragon-team-builder = "dragon_team_builder.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dragon_team_builder = [
    "data/*.json",
    "data/images/*.webp",
    "data/factions/*.webp",
]
